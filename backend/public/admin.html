<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Admin</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e0ddd6;
      --accent: #2f6f4e;
      --danger: #b4443c;
      --warn: #b8860b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.2rem; margin: 0; }
    header nav { display: flex; gap: 8px; }
    header nav button {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    header nav button.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    header a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn:hover { opacity: 0.9; }
    .btn.ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.danger { background: var(--danger); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      vertical-align: middle;
    }
    th {
      background: #ebe8e2;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    tr:last-child td { border-bottom: none; }
    tr.expandable:hover { background: #faf9f6; }
    td img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }
    td .actions { display: flex; gap: 6px; }
    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .pill.placed { background: #e7f0fa; color: #1b4b7a; }
    .pill.shipped { background: #fff4e0; color: #8a5a00; }
    .pill.delivered { background: #e6f4e8; color: #1e6b34; }
    .pill.cancelled { background: #fbe8e6; color: #8f2b24; }
    select.status {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      background: var(--surface);
    }
    .details td {
      background: #faf9f6;
      font-size: 0.85rem;
    }
    .details ul { margin: 0; padding-left: 18px; }
    .details strong { color: var(--text); }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
    }
    .error {
      background: #fbe8e6;
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 520px;
      max-height: 90vh;
      overflow: auto;
    }
    .modal h2 { margin-top: 0; font-size: 1.1rem; }
    .modal label {
      display: block;
      font-size: 0.85rem;
      margin: 12px 0 6px;
    }
    .modal input, .modal textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .modal textarea { resize: vertical; }
    .modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛍 Store Admin</h1>
    <nav>
      <button id="tab-products" class="active" onclick="showTab('products')">Products</button>
      <button id="tab-orders" onclick="showTab('orders')">Orders</button>
    </nav>
    <a href="http://localhost:5173" target="_blank">View storefront →</a>
  </header>

  <main>
    <div id="error" class="error" style="display:none"></div>

    <div id="view-products">
      <div class="toolbar">
        <h2>Products</h2>
        <button class="btn" onclick="openProductModal()">+ Add product</button>
      </div>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="products-body"></tbody>
      </table>
    </div>

    <div id="view-orders" style="display:none">
      <div class="toolbar">
        <h2>Orders</h2>
      </div>
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Email</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </main>

  <div class="modal-backdrop" id="product-modal">
    <div class="modal">
      <h2 id="product-modal-title">Add product</h2>
      <input type="hidden" id="f-id" />
      <label>Name</label>
      <input id="f-name" required />
      <div class="form-row">
        <div>
          <label>Price ($)</label>
          <input id="f-price" type="number" step="0.01" min="0" required />
        </div>
        <div>
          <label>Stock</label>
          <input id="f-stock" type="number" min="0" required />
        </div>
      </div>
      <label>Category</label>
      <input id="f-category" list="category-list" required />
      <datalist id="category-list"></datalist>
      <label>Image URL</label>
      <input id="f-image" />
      <label>Description</label>
      <textarea id="f-description" rows="3"></textarea>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeProductModal()">Cancel</button>
        <button class="btn" onclick="saveProduct()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const money = (n) => "$" + Number(n).toFixed(2);
    const shortId = (id) => id.slice(0, 8);

    let products = [];
    let orders = [];

    function showError(msg) {
      const el = $("error");
      if (msg) {
        el.textContent = msg;
        el.style.display = "block";
      } else {
        el.style.display = "none";
      }
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2000);
    }

    async function api(path, options) {
      const res = await fetch("/api" + path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || "Request failed");
      }
      return res.status === 204 ? null : res.json();
    }

    function showTab(name) {
      $("tab-products").classList.toggle("active", name === "products");
      $("tab-orders").classList.toggle("active", name === "orders");
      $("view-products").style.display = name === "products" ? "block" : "none";
      $("view-orders").style.display = name === "orders" ? "block" : "none";
    }

    async function loadProducts() {
      products = await api("/products");
      renderProducts();
    }

    function renderProducts() {
      const body = $("products-body");
      if (products.length === 0) {
        body.innerHTML = '<tr><td colspan="7" class="empty">No products yet.</td></tr>';
        return;
      }
      body.innerHTML = products
        .map(
          (p) => `
          <tr>
            <td>${p.imageUrl ? `<img src="${p.imageUrl}" alt="" />` : ""}</td>
            <td>${p.id}</td>
            <td><strong>${escapeHtml(p.name)}</strong></td>
            <td>${escapeHtml(p.category)}</td>
            <td>${money(p.price)}</td>
            <td>${p.stock}</td>
            <td>
              <div class="actions">
                <button class="btn ghost" onclick="editProduct(${p.id})">Edit</button>
                <button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button>
              </div>
            </td>
          </tr>`
        )
        .join("");
    }

    async function loadOrders() {
      orders = await api("/orders");
      renderOrders();
    }

    function renderOrders() {
      const body = $("orders-body");
      if (orders.length === 0) {
        body.innerHTML = '<tr><td colspan="7" class="empty">No orders yet.</td></tr>';
        return;
      }
      body.innerHTML = orders
        .map(
          (o) => `
          <tr class="expandable" onclick="toggleOrderDetails('${o.id}')">
            <td><strong>#${shortId(o.id)}</strong></td>
            <td>${escapeHtml(o.customerName)}</td>
            <td>${escapeHtml(o.customerEmail)}</td>
            <td>${o.itemsCount}</td>
            <td>${money(o.total)}</td>
            <td onclick="event.stopPropagation()">
              <select class="status" onchange="changeStatus('${o.id}', this.value)">
                ${["placed", "shipped", "delivered", "cancelled"]
                  .map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`)
                  .join("")}
              </select>
            </td>
            <td>${new Date(o.createdAt).toLocaleDateString()}</td>
          </tr>
          <tr id="details-${o.id}" class="details" style="display:none"></tr>`
        )
        .join("");
    }

    async function toggleOrderDetails(id) {
      const row = $("details-" + id);
      if (row.style.display === "none") {
        const order = await api("/orders/" + id);
        row.innerHTML = `<td colspan="7">
          <strong>Shipping to:</strong> ${escapeHtml(order.customer.address)}<br />
          <ul>
            ${order.items
              .map(
                (i) =>
                  `<li>${escapeHtml(i.name)} × ${i.quantity} — ${money(i.price * i.quantity)}</li>`
              )
              .join("")}
          </ul>
        </td>`;
        row.style.display = "table-row";
      } else {
        row.style.display = "none";
      }
    }

    async function changeStatus(id, status) {
      try {
        await api("/orders/" + id, { method: "PATCH", body: JSON.stringify({ status }) });
        toast("Order " + shortId(id) + " marked " + status);
      } catch (e) {
        showError(e.message);
      }
    }

    function openProductModal(product) {
      $("product-modal-title").textContent = product ? "Edit product" : "Add product";
      $("f-id").value = product ? product.id : "";
      $("f-name").value = product ? product.name : "";
      $("f-price").value = product ? product.price : "";
      $("f-stock").value = product ? product.stock : "";
      $("f-category").value = product ? product.category : "";
      $("f-image").value = product ? product.imageUrl : "";
      $("f-description").value = product ? product.description : "";
      $("product-modal").classList.add("open");
    }

    function editProduct(id) {
      openProductModal(products.find((p) => p.id === id));
    }

    function closeProductModal() {
      $("product-modal").classList.remove("open");
    }

    async function saveProduct() {
      const id = $("f-id").value;
      const payload = {
        name: $("f-name").value.trim(),
        price: Number($("f-price").value),
        stock: Number($("f-stock").value),
        category: $("f-category").value.trim() || "general",
        imageUrl: $("f-image").value.trim(),
        description: $("f-description").value.trim(),
      };
      if (!payload.name || isNaN(payload.price)) {
        return showError("Name and price are required.");
      }
      try {
        if (id) {
          await api("/products/" + id, { method: "PUT", body: JSON.stringify(payload) });
          toast("Product updated");
        } else {
          await api("/products", { method: "POST", body: JSON.stringify(payload) });
          toast("Product added");
        }
        closeProductModal();
        showError("");
        await loadProducts();
        await loadCategoryList();
      } catch (e) {
        showError(e.message);
      }
    }

    async function deleteProduct(id) {
      const p = products.find((x) => x.id === id);
      if (!confirm(`Delete "${p ? p.name : "this product"}"?`)) return;
      try {
        await api("/products/" + id, { method: "DELETE" });
        toast("Product deleted");
        await loadProducts();
        await loadCategoryList();
      } catch (e) {
        showError(e.message);
      }
    }

    async function loadCategoryList() {
      const categories = await api("/categories");
      $("category-list").innerHTML = categories
        .map((c) => `<option value="${escapeHtml(c.name)}"></option>`)
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeProductModal();
    });

    (async function init() {
      try {
        await Promise.all([loadProducts(), loadOrders(), loadCategoryList()]);
      } catch (e) {
        showError(e.message);
      }
    })();
  </script>
</body>
</html>
